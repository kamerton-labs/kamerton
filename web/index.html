<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kamerton</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      ;(function () {
        try {
          // Two themes; no saved choice (or the old "system" value) follows the system setting.
          var t = localStorage.getItem('kamerton-theme')
          var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          // Interface language: English unless Russian was chosen.
          if (localStorage.getItem('kamerton-lang') === 'ru') document.documentElement.lang = 'ru'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
