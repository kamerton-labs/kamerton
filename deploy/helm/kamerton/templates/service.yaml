apiVersion: v1
kind: Service
metadata:
  name: {{ include "kamerton.fullname" . }}
  labels:
    {{- include "kamerton.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "kamerton.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: metrics
      port: 8081
      targetPort: metrics
