{{- if and (not .Values.auth.existingSecret) .Values.auth.username .Values.auth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kamerton.fullname" . }}-auth
  labels:
    {{- include "kamerton.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.auth.username | quote }}
  password: {{ .Values.auth.password | quote }}
{{- end }}
